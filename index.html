<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Trump Card Generator Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: pan-y; margin: 0; padding: 0; user-select: none; }
    body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    /* ツールバー */
    .toolbar {
      width: 100%; max-width: 850px; background: #222; padding: 12px; border-radius: 8px; margin: 10px 0;
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; z-index: 100;
    }
    .toolbar label { font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .toolbar input, .toolbar select, .toolbar button {
      padding: 6px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 13px;
    }
    .btn-group { display: flex; gap: 2px; }
    .btn-group button { min-width: 32px; cursor: pointer; }
    .btn-download { background: #4CAF50 !important; font-weight: bold; border: none !important; cursor: pointer; padding: 8px 16px !important; }

    /* トランプカード */
    .card-wrapper { padding: 10px; display: flex; justify-content: center; width: 100%; }
    #card {
      width: 340px; height: 500px; background-color: #1a1a24; border-radius: 16px;
      position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      touch-action: none; cursor: crosshair;
    }
    
    /* トランプ装飾 */
    .trump-decor { transition: opacity 0.2s; pointer-events: none; }
    .border-outer { position: absolute; inset: 12px; border: 2px solid #e0af68; border-radius: 12px; }
    .border-inner { position: absolute; inset: 16px; border: 1px solid #e0af68; border-radius: 8px; }
    .corner-mark { position: absolute; font-family: 'Noto Serif JP', serif; font-size: 18px; line-height: 1.1; text-align: center; color: #e0af68; }
    .top-left { top: 22px; left: 22px; }
    .bottom-right { bottom: 22px; right: 22px; transform: rotate(180deg); }

    /* テキストボックス */
    .text-box {
      position: absolute; min-width: 40px; min-height: 30px; cursor: move;
      display: inline-block; padding: 4px; border: 1px dashed transparent;
      touch-action: none;
    }
    .text-box.selected { border-color: #4CAF50; }
    .text-content {
      outline: none; word-break: break-all; white-space: pre-wrap;
      line-height: 1.3; cursor: move;
    }
    .text-content[contenteditable="true"] {
      cursor: text; user-select: text; -webkit-user-select: text;
    }

    /* 右上：削除ボタン(×) */
    .btn-delete {
      display: none; position: absolute; top: -12px; right: -12px;
      width: 24px; height: 24px; background: #ff4d4f; color: white; border-radius: 50%;
      text-align: center; line-height: 22px; font-size: 14px; font-weight: bold; cursor: pointer; border: 2px solid #fff;
    }
    .text-box.selected .btn-delete { display: block; }

    /* 左下：サイズ変更ハンドル(⤢) */
    .handle-resize {
      display: none; position: absolute; bottom: -12px; left: -12px;
      width: 24px; height: 24px; background: #2196F3; color: white; border-radius: 50%;
      text-align: center; line-height: 22px; font-size: 14px; cursor: sw-resize; border: 2px solid #fff;
      touch-action: none;
    }
    .text-box.selected .handle-resize { display: block; }

    .tip { font-size: 12px; color: #aaa; margin-bottom: 5px; text-align: center; }
  </style>
</head>
<body>

  <!-- 設定ツールバー -->
  <div class="toolbar">
    <label style="flex-direction: row; gap: 5px;">
      <input type="checkbox" id="trumpToggle" checked> トランプ風
    </label>
    <label>背景<input type="color" id="bgColor" value="#1a1a24"></label>
    <label class="trump-ctrl">枠/マーク色<input type="color" id="borderColor" value="#e0af68"></label>
    <label class="trump-ctrl">上段マーク<input type="text" id="symbolInput" value="✦" style="width: 45px; text-align: center;"></label>
    <label class="trump-ctrl">下段文字<input type="text" id="labelInput" value="A" style="width: 45px; text-align: center;"></label>

    <div style="width: 100%; height: 1px; background: #333; margin: 2px 0;"></div>

    <label>フォント
      <select id="fontFamily">
        <option value="'Noto Serif JP', serif">明朝体</option>
        <option value="'Noto Sans JP', sans-serif">ゴシック</option>
      </select>
    </label>
    <label>文字色<input type="color" id="textColor" value="#ffffff"></label>
    <label>文字揃え
      <div class="btn-group">
        <button type="button" onclick="setTextAlign('left')">左</button>
        <button type="button" onclick="setTextAlign('center')">中</button>
        <button type="button" onclick="setTextAlign('right')">右</button>
      </div>
    </label>
    <button class="btn-download" onclick="downloadCard()">画像保存</button>
  </div>

  <div class="tip">💡 移動: ドラッグ / 編集: <strong>1回タップ</strong> / サイズ: 左下(⤢)を引っ張る</div>

  <!-- カードプレビュー -->
  <div class="card-wrapper">
    <div id="card">
      <div class="trump-decor border-outer" id="bOuter"></div>
      <div class="trump-decor border-inner" id="bInner"></div>
      <div class="trump-decor corner-mark top-left" id="cTop"><span>✦</span><br><span>A</span></div>
      <div class="trump-decor corner-mark bottom-right" id="cBottom"><span>✦</span><br><span>A</span></div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    let selectedBox = null;
    let activeDrag = false;
    let activeResize = false;
    let startX, startY, initialLeft, initialTop;
    let hasMoved = false; // 移動したかどうかの判定用

    // カードタップで新規作成
    card.addEventListener('pointerdown', (e) => {
      if (e.target === card || e.target.classList.contains('trump-decor')) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - 40;
        const y = e.clientY - rect.top - 15;
        createTextbox(x, y, "text");
      }
    });

    function createTextbox(x, y, text) {
      const box = document.createElement('div');
      box.className = 'text-box selected';
      box.style.left = `${Math.max(10, Math.min(x, 240))}px`;
      box.style.top = `${Math.max(10, Math.min(y, 440))}px`;

      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = false;
      content.innerText = text;
      content.style.fontSize = '24px';
      content.style.fontFamily = document.getElementById('fontFamily').value;
      content.style.color = document.getElementById('textColor').value;
      content.style.textAlign = 'center';

      // 右上：削除ボタン
      const delBtn = document.createElement('div');
      delBtn.className = 'btn-delete';
      delBtn.innerHTML = '×';
      delBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        box.remove();
        selectedBox = null;
      });

      // 左下：リサイズハンドル
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'handle-resize';
      resizeHandle.innerHTML = '⤢';
      setupResize(resizeHandle, box, content);

      box.appendChild(delBtn);
      box.appendChild(resizeHandle);
      box.appendChild(content);
      card.appendChild(box);

      selectElement(box);
      setupInteraction(box, content);
    }

    function selectElement(box) {
      if (selectedBox && selectedBox !== box) {
        selectedBox.classList.remove('selected');
        const prevContent = selectedBox.querySelector('.text-content');
        prevContent.contentEditable = false;
      }
      selectedBox = box;
      box.classList.add('selected');

      const content = box.querySelector('.text-content');
      document.getElementById('fontFamily').value = content.style.fontFamily;
      document.getElementById('textColor').value = rgbToHex(content.style.color);
    }

    // ★スマート判定：ドラッグなら移動、タップだけなら文字入力モードへ
    function setupInteraction(box, content) {
      box.addEventListener('pointerdown', (e) => {
        if (e.target.classList.contains('btn-delete') || e.target.classList.contains('handle-resize')) return;
        if (content.isContentEditable) return; // すでに編集中なら何もしない

        selectElement(box);
        activeDrag = true;
        hasMoved = false;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = box.offsetLeft;
        initialTop = box.offsetTop;
        box.setPointerCapture(e.pointerId);
      });

      box.addEventListener('pointermove', (e) => {
        if (!activeDrag || box !== selectedBox) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        // 4ピクセル以上動いたら「移動中」とみなす
        if (Math.hypot(dx, dy) > 4) {
          hasMoved = true;
          box.style.left = `${initialLeft + dx}px`;
          box.style.top = `${initialTop + dy}px`;
        }
      });

      const handlePointerUp = (e) => {
        if (!activeDrag) return;
        activeDrag = false;
        try { box.releasePointerCapture(e.pointerId); } catch(err) {}

        // ★ほとんど動かさずに指を離した＝「1回タップ」と判定して編集モードON！
        if (!hasMoved) {
          content.contentEditable = true;
          content.focus();
        }
      };

      box.addEventListener('pointerup', handlePointerUp);
      box.addEventListener('pointercancel', handlePointerUp);

      // フォーカスが外れたら編集モードOFF
      content.addEventListener('blur', () => {
        content.contentEditable = false;
      });
    }

    // 右上固定のリサイズ処理
    function setupResize(handle, box, content) {
      let initialFontSize, fixedRight, fixedTop;

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        activeResize = true;
        startX = e.clientX;
        startY = e.clientY;
        
        initialFontSize = parseFloat(window.getComputedStyle(content).fontSize);
        fixedRight = box.offsetLeft + box.offsetWidth;
        fixedTop = box.offsetTop;

        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', (e) => {
        if (!activeResize) return;

        const deltaX = startX - e.clientX;
        const deltaY = e.clientY - startY;
        const delta = (deltaX + deltaY) * 0.4;

        const newSize = Math.max(10, Math.min(80, initialFontSize + delta));
        content.style.fontSize = `${newSize}px`;

        box.style.top = `${fixedTop}px`;
        box.style.left = `${fixedRight - box.offsetWidth}px`;
      });

      const stopResize = (e) => {
        activeResize = false;
        try { handle.releasePointerCapture(e.pointerId); } catch(err) {}
      };
      handle.addEventListener('pointerup', stopResize);
      handle.addEventListener('pointercancel', stopResize);
    }

    // トランプON/OFF切り替え
    const trumpToggle = document.getElementById('trumpToggle');
    trumpToggle.addEventListener('change', (e) => {
      const decors = document.querySelectorAll('.trump-decor');
      const ctrls = document.querySelectorAll('.trump-ctrl');
      decors.forEach(el => el.style.display = e.target.checked ? 'block' : 'none');
      ctrls.forEach(el => el.style.opacity = e.target.checked ? '1' : '0.4');
    });

    // 四隅のテキスト・記号更新
    function updateCorners() {
      const sym = document.getElementById('symbolInput').value;
      const lab = document.getElementById('labelInput').value;
      const html = `<span>${sym}</span><br><span>${lab}</span>`;
      document.getElementById('cTop').innerHTML = html;
      document.getElementById('cBottom').innerHTML = html;
    }
    document.getElementById('symbolInput').addEventListener('input', updateCorners);
    document.getElementById('labelInput').addEventListener('input', updateCorners);

    // 色・スタイル
    document.getElementById('bgColor').addEventListener('input', (e) => { card.style.backgroundColor = e.target.value; });
    document.getElementById('borderColor').addEventListener('input', (e) => {
      document.getElementById('bOuter').style.borderColor = e.target.value;
      document.getElementById('bInner').style.borderColor = e.target.value;
      document.getElementById('cTop').style.color = e.target.value;
      document.getElementById('cBottom').style.color = e.target.value;
    });

    document.getElementById('fontFamily').addEventListener('change', (e) => {
      if (selectedBox) {
        const content = selectedBox.querySelector('.text-content');
        const fixedRight = selectedBox.offsetLeft + selectedBox.offsetWidth;
        content.style.fontFamily = e.target.value;
        selectedBox.style.left = `${fixedRight - selectedBox.offsetWidth}px`;
      }
    });

    document.getElementById('textColor').addEventListener('input', (e) => {
      if (selectedBox) selectedBox.querySelector('.text-content').style.color = e.target.value;
    });

    function setTextAlign(align) {
      if (selectedBox) selectedBox.querySelector('.text-content').style.textAlign = align;
    }

    // 画面外タップで選択解除
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#card') && !e.target.closest('.toolbar')) {
        if (selectedBox) {
          selectedBox.classList.remove('selected');
          selectedBox.querySelector('.text-content').contentEditable = false;
          selectedBox = null;
        }
      }
    });

    // 画像ダウンロード
    function downloadCard() {
      if (selectedBox) {
        selectedBox.classList.remove('selected');
        selectedBox.querySelector('.text-content').contentEditable = false;
      }
      html2canvas(card, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'card.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    function rgbToHex(rgb) {
      if (!rgb || rgb.startsWith("#")) return rgb || "#ffffff";
      const res = rgb.match(/\d+/g);
      return res ? "#" + res.slice(0,3).map(x => (+x).toString(16).padStart(2, '0')).join('') : "#ffffff";
    }

    // 初期配置：中央に "text" を配置
    window.onload = () => {
      createTextbox(120, 230, "text");
      selectedBox.classList.remove('selected');
      selectedBox = null;
    };
  </script>
</body>
</html>
