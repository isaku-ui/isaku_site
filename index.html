<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI Trump Card Generator Ultra</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Yusei+Magic&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100vh; height: 100dvh;
      background-color: #121212; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; overflow: hidden; position: fixed;
    }
    input, select, textarea { font-family: inherit; }

    /* 上部バー */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1c1c24; border-bottom: 1px solid #333; padding: 6px 8px; z-index: 100; flex-shrink: 0;
    }
    .top-bar-group { display: flex; gap: 8px; margin-left: auto; }
    .btn-sm {
      background: #2b2b36; border: 1px solid #444; color: #eee; padding: 8px 12px;
      border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-sm:active { background: #444; }
    .undo-group { display: flex; gap: 8px; margin-right: auto; }

    /* ビューポート */
    .viewport {
      flex: 1; position: relative; overflow: hidden; display: flex;
      justify-content: center; align-items: center; touch-action: none;
      background: radial-gradient(circle, #252530 0%, #121212 100%);
    }
    #zoomWrapper { transform-origin: center center; will-change: transform; display: flex; justify-content: center; align-items: center; }

    /* カード本体 */
    #card {
      width: 680px; height: 1000px; background-color: #1a1a24; background-size: cover; background-position: center;
      border-radius: 32px; position: relative; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      touch-action: none; cursor: crosshair; flex-shrink: 0;
    }

    /* トランプ装飾 */
    .trump-decor { transition: opacity 0.2s; pointer-events: none; }
    .border-outer { position: absolute; inset: 24px; border: 4px solid #e0af68; border-radius: 24px; box-sizing: border-box; }
    .border-inner { position: absolute; inset: 32px; border: 2px solid #e0af68; border-radius: 16px; box-sizing: border-box; }
    .frame-none .border-outer, .frame-none .border-inner { display: none; }
    .frame-solid .border-inner { display: none; }
    .frame-corner .border-inner { display: none; }
    .frame-corner .border-outer { border: none; }
    .frame-corner .border-outer::before, .frame-corner .border-outer::after {
      content: ''; position: absolute; width: 100%; height: 100%; border: 4px solid #e0af68; border-radius: 24px;
      clip-path: polygon(0 0, 15% 0, 15% 15%, 85% 15%, 85% 0, 100% 0, 100% 15%, 85% 15%, 85% 85%, 100% 85%, 100% 100%, 85% 100%, 85% 85%, 15% 85%, 15% 100%, 0 100%, 0 85%, 15% 85%, 15% 15%, 0 15%);
    }
    .corner-mark { position: absolute; font-family: 'Noto Serif JP', serif; font-size: 36px; line-height: 1.1; text-align: center; color: #e0af68; font-weight: bold; }
    .top-left { top: 44px; left: 44px; }
    .bottom-right { bottom: 44px; right: 44px; transform: rotate(180deg); }

    /* ガイド線 */
    .guide-line { position: absolute; background: #ff4d4f; z-index: 50; display: none; pointer-events: none; }
    .guide-v { width: 1px; height: 100%; top: 0; left: 0; }
    .guide-h { height: 1px; width: 100%; left: 0; top: 0; }

    /* アイテム */
    .item-box {
      position: absolute; display: inline-block; padding: 4px; border: 2px dashed transparent;
      touch-action: none; cursor: move; box-sizing: border-box; z-index: 10; width: max-content;
    }
    .item-box.selected { border-color: #4CAF50; z-index: 90 !important; }
    .item-content { outline: none; line-height: 1.2; white-space: pre; pointer-events: none; transform-origin: center center; }
    img.item-content { width: 100%; height: 100%; object-fit: contain; }
    .text-content.editing { pointer-events: auto; cursor: text; user-select: text; -webkit-user-select: text; border-color: transparent; }

    /* 操作ハンドル */
    .btn-delete, .handle-resize, .handle-rotate {
      display: none; position: absolute; width: 36px; height: 36px; color: white; border-radius: 50%;
      text-align: center; line-height: 32px; font-size: 20px; font-weight: bold; border: 3px solid #fff; pointer-events: auto;
    }
    .item-box.selected .btn-delete, .item-box.selected .handle-resize, .item-box.selected .handle-rotate { display: block; }
    .btn-delete { top: -18px; left: -18px; background: #ff4d4f; cursor: pointer; }
    .handle-resize { bottom: -18px; right: -18px; background: #2196F3; cursor: se-resize; touch-action: none; }
    .handle-rotate { top: -18px; right: -18px; background: #FF9800; cursor: grab; touch-action: none; }

    /* レイヤーパネル */
    .layer-panel {
      position: absolute; top: 0; left: -260px; width: 260px; height: 100%;
      background: rgba(22, 22, 28, 0.95); backdrop-filter: blur(8px); border-right: 1px solid #444;
      z-index: 200; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.7);
    }
    .layer-panel.open { left: 0; }
    .layer-tab-handle {
      position: absolute; top: 50px; right: -40px; width: 40px; height: 80px;
      background: rgba(43, 43, 54, 0.95); border: 1px solid #444; border-left: none;
      border-radius: 0 12px 12px 0; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 4px 0 10px rgba(0,0,0,0.5); font-size: 22px; color: #fff;
    }
    .layer-header { padding: 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; font-weight: bold; }
    .layer-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .layer-item { background: #2a2a36; border: 1px solid #3d3d4d; border-radius: 6px; padding: 6px 8px; display: flex; align-items: center; font-size: 12px; cursor: pointer; }
    .layer-item.active { border-color: #4CAF50; background: #25382b; }
    .layer-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 6px; }
    .layer-btn { background: #3a3a4c; border: none; color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 2px; }

    /* 下部UI */
    .bottom-ui { background: #1c1c24; border-top: 1px solid #333; z-index: 100; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tab-buttons { display: flex; background: #121212; border-bottom: 1px solid #333; }
    .tab-btn { flex: 1; padding: 10px 0; background: transparent; border: none; color: #888; font-size: 13px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { color: #fff; border-bottom: 2px solid #4CAF50; background: #1c1c24; }
    
    .toolbar-panel { display: none; padding: 10px 12px; overflow-x: auto; white-space: nowrap; align-items: center; gap: 14px; -webkit-overflow-scrolling: touch; }
    .toolbar-panel.active { display: flex; }
    .toolbar-panel::-webkit-scrollbar { height: 4px; }
    .toolbar-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

    .tool-item { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #bbb; flex-shrink: 0; }
    input[type="text"], select, button { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #2c2c38; color: #fff; font-size: 13px; cursor: pointer; }
    input[type="color"] { border: 1px solid #444; border-radius: 6px; background: #2c2c38; width: 40px; height: 32px; padding: 1px; }
    .btn-group { display: flex; gap: 2px; }
    .btn-group button { min-width: 36px; }
    .btn-group button.active { background: #4CAF50; color: white; border-color: #4CAF50; }
    .file-upload { position: relative; overflow: hidden; display: inline-block; }
    .file-upload input { position: absolute; font-size: 100px; opacity: 0; right: 0; top: 0; cursor: pointer; }
    .btn-primary { background: #4CAF50; color: white; font-weight: bold; border: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="undo-group">
      <button class="btn-sm" onclick="undo()" id="btnUndo">↩️</button>
      <button class="btn-sm" onclick="redo()" id="btnRedo">↪️</button>
    </div>
    <div class="top-bar-group">
      <button class="btn-sm" onclick="saveProject()" title="セーブ">💾</button>
      <button class="btn-sm" onclick="loadProject()" title="ロード">📂</button>
      <button class="btn-sm" onclick="resetZoom(true)" title="画面に合わせる">🔍</button>
    </div>
  </div>

  <div class="layer-panel" id="layerPanel">
    <div class="layer-tab-handle" onclick="toggleLayerPanel()">📑</div>
    <div class="layer-header">
      <span>レイヤー管理</span>
      <button class="btn-sm" onclick="toggleLayerPanel()" style="padding: 2px 8px; font-size: 12px;">×</button>
    </div>
    <div class="layer-list" id="layerList"></div>
  </div>

  <div class="viewport" id="viewport">
    <div id="zoomWrapper">
      <div id="card" class="frame-simple">
        <div class="trump-decor border-outer" id="bOuter"></div>
        <div class="trump-decor border-inner" id="bInner"></div>
        <div class="trump-decor corner-mark top-left" id="cTop"><span>✦</span><br><span>A</span></div>
        <div class="trump-decor corner-mark bottom-right" id="cBottom"><span>✦</span><br><span>A</span></div>
        <div id="guideV" class="guide-line guide-v"></div>
        <div id="guideH" class="guide-line guide-h"></div>
      </div>
    </div>
  </div>

  <div class="bottom-ui">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('tabCard')">カード設定</button>
      <button class="tab-btn" onclick="switchTab('tabAdd')">追加</button>
      <button class="tab-btn" id="tabBtnEdit" onclick="switchTab('tabEdit')" style="display:none; color:#4CAF50;">選択要素</button>
    </div>

    <div id="tabCard" class="toolbar-panel active">
      <label class="tool-item">背景色 <input type="color" id="bgColor" value="#1a1a24" onchange="updateCardStyle()"></label>
      <label class="tool-item file-upload">
        背景画像 <button>選択</button>
        <input type="file" accept="image/*" onchange="setBgImage(this)">
      </label>
      <label class="tool-item">
        枠デザイン
        <select id="frameType" onchange="updateCardStyle()">
          <option value="frame-simple">シンプル</option>
          <option value="frame-solid">太線</option>
          <option value="frame-corner">コーナー飾り</option>
          <option value="frame-none">枠なし</option>
        </select>
      </label>
      <label class="tool-item">枠色 <input type="color" id="borderColor" value="#e0af68" onchange="updateCardStyle()"></label>
      <label class="tool-item">上マーク <input type="text" id="symbolInput" value="✦" style="width: 44px; text-align: center;" oninput="updateCardStyle()"></label>
      <label class="tool-item">下文字 <input type="text" id="labelInput" value="A" style="width: 44px; text-align: center;" oninput="updateCardStyle()"></label>
    </div>

    <div id="tabAdd" class="toolbar-panel">
      <button onclick="addElement('text')">➕ テキスト追加</button>
      <label class="file-upload">
        <button>🖼 画像追加</button>
        <input type="file" accept="image/*" onchange="addElement('image', this)">
      </label>
      <div style="flex:1;"></div>
      <button class="btn-primary" onclick="downloadCard()" style="padding: 10px 20px;">画像保存</button>
    </div>

    <div id="tabEdit" class="toolbar-panel">
<!-- テキスト専用設定 -->
      <div id="textOnlyTools" style="display:flex; gap:14px; align-items:center;">
        <label class="tool-item">サイズ <input type="number" id="itemFontSize" oninput="updateFontSize(this.value)" style="width: 54px; text-align: center;"></label>
        <label class="tool-item">
          フォント
          <select id="itemFont" onchange="updateItemStyle('fontFamily', this.value)">
            <option value="'Noto Serif JP', serif">明朝</option>
            <option value="'Noto Sans JP', sans-serif">ゴシック</option>
            <option value="'Kaisei Decol', serif">装飾明朝</option>
            <option value="'Yusei Magic', sans-serif">ポップ体</option>
            <option value="'DotGothic16', sans-serif">ドット</option>
          </select>
        </label>
        <label class="tool-item">色 <input type="color" id="itemColor" onchange="updateItemStyle('color', this.value)"></label>
        <div class="tool-item">装飾
          <div class="btn-group">
            <button id="btnBold" onclick="toggleStyle('fontWeight', 'bold', 'normal')">B</button>
          </div>
        </div>
        <div class="tool-item">文字揃え
          <div class="btn-group">
            <button onclick="updateItemStyle('textAlign', 'left')">左</button>
            <button onclick="updateItemStyle('textAlign', 'center')">中</button>
            <button onclick="updateItemStyle('textAlign', 'right')">右</button>
          </div>
        </div>
      </div>
      
      <!-- 共通設定 (中央配置・複製・削除) -->
      <div style="display:flex; gap:14px; align-items:center; border-left:1px solid #444; padding-left:14px; margin-left:14px;">
        <button onclick="centerSelected()" style="background:#2b2b36; border:1px solid #555;">🎯 中央へ</button>
        <div class="tool-item">複製＆反転
          <div class="btn-group">
            <button onclick="duplicateSelected('normal')" title="通常コピー">📄</button>
            <button onclick="duplicateSelected('point')" title="トランプ風に180度反転コピー">🃏</button>
            <button onclick="duplicateSelected('horizontal')" title="左右対称に反転コピー">↔️</button>
            <button onclick="duplicateSelected('vertical')" title="上下対称に反転コピー">↕️</button>
          </div>
        </div>
        <button style="background:#ff4d4f; border:none;" onclick="deleteSelected()">🗑 削除</button>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const zoomWrapper = document.getElementById('zoomWrapper');
    const viewport = document.getElementById('viewport');
    
    const CARD_W = 680;
    const CARD_H = 1000;
    
    let stateStack = [];
    let stateIndex = -1;
    let isRestoring = false;
    
    let elements = [];
    let cardConfig = { bg: '#1a1a24', bgImg: '', frame: 'frame-simple', color: '#e0af68', sym: '✦', lab: 'A' };
    
    let selectedId = null;
    let idCounter = 0;

    function saveState(skipCheck = false) {
      if (isRestoring) return;
      const newState = { config: JSON.parse(JSON.stringify(cardConfig)), elements: JSON.parse(JSON.stringify(elements)) };
      if (!skipCheck && stateIndex >= 0 && JSON.stringify(stateStack[stateIndex]) === JSON.stringify(newState)) return;
      stateStack = stateStack.slice(0, stateIndex + 1);
      stateStack.push(newState);
      if (stateStack.length > 30) stateStack.shift(); else stateIndex++;
      updateUndoRedoUI();
    }
    function updateUndoRedoUI() {
      document.getElementById('btnUndo').style.opacity = stateIndex > 0 ? 1 : 0.3;
      document.getElementById('btnRedo').style.opacity = stateIndex < stateStack.length - 1 ? 1 : 0.3;
    }
    function undo() { if (stateIndex > 0) { stateIndex--; renderState(); } }
    function redo() { if (stateIndex < stateStack.length - 1) { stateIndex++; renderState(); } }

    function saveProject() {
      localStorage.setItem('trumpCardData', JSON.stringify(stateStack[stateIndex]));
      alert('保存しました！');
    }
    function loadProject() {
      const data = localStorage.getItem('trumpCardData');
      if (data) {
        isRestoring = true;
        const state = JSON.parse(data);
        cardConfig = state.config; elements = state.elements;
        idCounter = elements.length > 0 ? Math.max(...elements.map(e => parseInt(e.id.split('_')[1]))) : 0;
        isRestoring = false; saveState(true); renderState();
      } else alert('データがありません。');
    }

    function renderState() {
      isRestoring = true;
      const state = stateStack[stateIndex];
      cardConfig = JSON.parse(JSON.stringify(state.config));
      elements = JSON.parse(JSON.stringify(state.elements));
      
      document.getElementById('bgColor').value = cardConfig.bg;
      document.getElementById('frameType').value = cardConfig.frame;
      document.getElementById('borderColor').value = cardConfig.color;
      document.getElementById('symbolInput').value = cardConfig.sym;
      document.getElementById('labelInput').value = cardConfig.lab;
      applyCardConfig();

      card.querySelectorAll('.item-box').forEach(el => el.remove());
      selectedId = null;
      elements.sort((a, b) => a.z - b.z).forEach(el => createDOMElement(el));
      updateLayerPanel(); selectElement(null); isRestoring = false;
    }

    function updateCardStyle() {
      cardConfig.bg = document.getElementById('bgColor').value;
      cardConfig.frame = document.getElementById('frameType').value;
      cardConfig.color = document.getElementById('borderColor').value;
      cardConfig.sym = document.getElementById('symbolInput').value;
      cardConfig.lab = document.getElementById('labelInput').value;
      applyCardConfig(); saveState();
    }
    function applyCardConfig() {
      card.style.backgroundColor = cardConfig.bg;
      card.style.backgroundImage = cardConfig.bgImg ? `url(${cardConfig.bgImg})` : 'none';
      card.className = cardConfig.frame;
      document.getElementById('bOuter').style.borderColor = cardConfig.color;
      document.getElementById('bInner').style.borderColor = cardConfig.color;
      document.querySelectorAll('.corner-mark').forEach(el => el.style.color = cardConfig.color);
      const html = `<span>${cardConfig.sym}</span><br><span>${cardConfig.lab}</span>`;
      document.getElementById('cTop').innerHTML = html;
      document.getElementById('cBottom').innerHTML = html;
    }
    function setBgImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => { cardConfig.bgImg = e.target.result; applyCardConfig(); saveState(); };
        reader.readAsDataURL(input.files[0]);
      }
      input.value = "";
    }

    function addElement(type, fileInput = null) {
      const el = { 
        id: 'item_' + (++idCounter), type: type, x: 200, y: 400, z: elements.length, 
        style: {}, transform: { rotate: 0, scaleX: 1, scaleY: 1 } 
      };
      if (type === 'text') {
        el.content = "テキスト";
        el.style = { fontFamily: document.getElementById('itemFont').value, fontSize: '48px', color: '#ffffff', textAlign: 'center', fontWeight: 'normal', textShadow: 'none', WebkitTextStroke: 'none', writingMode: 'horizontal-tb' };
        elements.push(el); createDOMElement(el); selectElement(el.id); saveState();
      } else if (type === 'image' && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => { el.content = e.target.result; el.w = 300; elements.push(el); createDOMElement(el); selectElement(el.id); saveState(); };
        reader.readAsDataURL(fileInput.files[0]); fileInput.value = "";
      }
    }

    function createDOMElement(elData) {
      const box = document.createElement('div');
      box.className = 'item-box'; box.id = elData.id;
      box.style.left = elData.x + 'px'; box.style.top = elData.y + 'px'; box.style.zIndex = elData.z;
      if (elData.w) box.style.width = elData.w + 'px';

      let content;
      if (elData.type === 'text') {
        content = document.createElement('div'); content.className = 'item-content text-content';
        content.innerText = elData.content; Object.assign(content.style, elData.style);
      } else {
        content = document.createElement('img'); content.className = 'item-content'; content.src = elData.content;
      }
      
      if (!elData.transform) elData.transform = { rotate: 0, scaleX: 1, scaleY: 1 };
      box.style.transform = `rotate(${elData.transform.rotate}deg)`;
      content.style.transform = `scale(${elData.transform.scaleX}, ${elData.transform.scaleY})`;
      
      const delBtn = document.createElement('div'); delBtn.className = 'btn-delete'; delBtn.innerHTML = '×';
      delBtn.onpointerdown = (e) => { e.stopPropagation(); deleteElement(elData.id); };
      const resizeHandle = document.createElement('div'); resizeHandle.className = 'handle-resize'; resizeHandle.innerHTML = '⤢';
      const rotateHandle = document.createElement('div'); rotateHandle.className = 'handle-rotate'; rotateHandle.innerHTML = '↻';

      box.appendChild(delBtn); box.appendChild(resizeHandle); box.appendChild(rotateHandle); box.appendChild(content); card.appendChild(box);
      setupInteraction(box, content, resizeHandle, rotateHandle, elData);
    }

    // --- 複製＆反転 ---
    function duplicateSelected(mode) {
      if (!selectedId) return;
      const source = elements.find(e => e.id === selectedId);
      const box = document.getElementById(selectedId);
      const w = box.offsetWidth; const h = box.offsetHeight;
      
      let newX = source.x; let newY = source.y;
      let newRot = source.transform.rotate;
      let newSx = source.transform.scaleX;
      let newSy = source.transform.scaleY;

      if (mode === 'point') { 
        newX = CARD_W - source.x - w; newY = CARD_H - source.y - h; newRot = (newRot + 180) % 360;
      } else if (mode === 'horizontal') {
        newX = CARD_W - source.x - w; newSx *= -1;
      } else if (mode === 'vertical') {
        newY = CARD_H - source.y - h; newSy *= -1;
      } else { 
        newX += 20; newY += 20;
      }

      const newEl = {
        id: 'item_' + (++idCounter), type: source.type, content: source.content,
        x: newX, y: newY, w: source.w, z: elements.length,
        style: JSON.parse(JSON.stringify(source.style)),
        transform: { rotate: newRot, scaleX: newSx, scaleY: newSy }
      };
      
      elements.push(newEl); createDOMElement(newEl); selectElement(newEl.id); saveState();
    }
    
    // --- 中央配置 ---
    function centerSelected() {
      if (!selectedId) return;
      const elData = elements.find(e => e.id === selectedId);
      const box = document.getElementById(selectedId);
      elData.x = (CARD_W - box.offsetWidth) / 2;
      elData.y = (CARD_H - box.offsetHeight) / 2;
      box.style.left = elData.x + 'px';
      box.style.top = elData.y + 'px';
      saveState();
    }

    let activeDrag = false, activeResize = false, activeRotate = false;
    let startX, startY, initialX, initialY, initialSize, isMultiTouchActive = false;

    function setupInteraction(box, content, handle, rotateHandle, elData) {
      let lastTapTime = 0; // ダブルタップ判定用
      let startAngle = 0, initialRotation = 0; // 回転用

      box.addEventListener('pointerdown', (e) => {
        if (isMultiTouchActive || e.target === handle || e.target === rotateHandle || e.target.classList.contains('btn-delete') || content.classList.contains('editing')) return;
        selectElement(elData.id);
        activeDrag = true; startX = e.clientX; startY = e.clientY; initialX = elData.x; initialY = elData.y;
        box.setPointerCapture(e.pointerId);
      });

      box.addEventListener('pointermove', (e) => {
        if (!activeDrag) return;
        const dx = (e.clientX - startX) / scale; const dy = (e.clientY - startY) / scale;
        const snap = checkSnap(box, initialX + dx, initialY + dy);
        elData.x = snap.x; elData.y = snap.y;
        box.style.left = elData.x + 'px'; box.style.top = elData.y + 'px';
        updateGuide(snap.guideX, snap.guideY);
      });

      const endDrag = (e) => {
        if (activeDrag) {
          activeDrag = false; hideGuide();
          try { box.releasePointerCapture(e.pointerId); } catch(err){}
          if (Math.abs(e.clientX - startX) < 3 && Math.abs(e.clientY - startY) < 3) {
            // ダブルタップ判定（300ms以内）
            const currentTime = Date.now();
            if (currentTime - lastTapTime < 300) {
              if (elData.type === 'text') { 
                content.contentEditable = true; content.classList.add('editing'); content.focus(); 
                // カーソルを末尾に合わせる
                const range = document.createRange(); const sel = window.getSelection();
                range.selectNodeContents(content); range.collapse(false);
                sel.removeAllRanges(); sel.addRange(range);
              }
              lastTapTime = 0;
            } else lastTapTime = currentTime;
          } else saveState();
        }
      };
      box.addEventListener('pointerup', endDrag); box.addEventListener('pointercancel', endDrag);

      if (elData.type === 'text') {
        content.addEventListener('blur', () => {
          content.contentEditable = false; content.classList.remove('editing');
          if (elData.content !== content.innerText) { elData.content = content.innerText; updateLayerPanel(); saveState(); }
        });
      }

      handle.addEventListener('pointerdown', (e) => {
        if (isMultiTouchActive) return;
        e.stopPropagation(); selectElement(elData.id); activeResize = true; startX = e.clientX; startY = e.clientY;
        initialSize = elData.type === 'text' ? parseFloat(window.getComputedStyle(content).fontSize) : box.offsetWidth;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', (e) => {
        if (!activeResize) return;
        const delta = (e.clientX - startX + e.clientY - startY) * 0.15 / scale;
        if (elData.type === 'text') {
          const newSize = Math.max(16, initialSize + delta);
          elData.style.fontSize = newSize + 'px';
          content.style.fontSize = elData.style.fontSize;
          // UI入力欄にサイズを反映
          if (selectedId === elData.id) {
            const sizeInput = document.getElementById('itemFontSize');
            if (sizeInput) sizeInput.value = Math.round(newSize);
          }
        } else {
          elData.w = Math.max(50, initialSize + delta * 2);
          box.style.width = elData.w + 'px';
        }
      });

      const endResize = (e) => {
        if (activeResize) { activeResize = false; try { handle.releasePointerCapture(e.pointerId); } catch(err){} saveState(); }
      };
      handle.addEventListener('pointerup', endResize); handle.addEventListener('pointercancel', endResize);

      // --- 回転ハンドルの処理 ---
      rotateHandle.addEventListener('pointerdown', (e) => {
        if (isMultiTouchActive) return;
        e.stopPropagation(); selectElement(elData.id); activeRotate = true; 
        const rect = box.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2; const centerY = rect.top + rect.height / 2;
        startAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
        initialRotation = elData.transform.rotate || 0;
        rotateHandle.setPointerCapture(e.pointerId);
      });

      rotateHandle.addEventListener('pointermove', (e) => {
        if (!activeRotate) return;
        const rect = box.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2; const centerY = rect.top + rect.height / 2;
        const currentAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
        
        // 回転角度を計算（0〜360度の範囲に整える）
        let newAngle = (initialRotation + (currentAngle - startAngle)) % 360;
        if (newAngle < 0) newAngle += 360; 
        
        // 90度（水平・垂直）の倍数に一番近い角度を探す
        const snapTarget = Math.round(newAngle / 90) * 90;
        
        // その角度との差が 8度以内 ならピタッと吸着させる
        if (Math.abs(newAngle - snapTarget) <= 8) {
          newAngle = snapTarget;
        }
        
        elData.transform.rotate = newAngle;
        box.style.transform = `rotate(${elData.transform.rotate}deg)`;
      });

      const endRotate = (e) => {
        if (activeRotate) { activeRotate = false; try { rotateHandle.releasePointerCapture(e.pointerId); } catch(err){} saveState(); }
      };
      rotateHandle.addEventListener('pointerup', endRotate); rotateHandle.addEventListener('pointercancel', endRotate);
    }

    function checkSnap(box, x, y) {
      const threshold = 5 / scale;
      const w = box.offsetWidth; const h = box.offsetHeight;
      const cx = x + w/2; const cy = y + h/2;
      let resX = x, resY = y, guideX = null, guideY = null;
      const targetsX = [CARD_W / 2]; const targetsY = [CARD_H / 2];
      
      document.querySelectorAll('.item-box').forEach(el => {
        if (el === box) return;
        targetsX.push(el.offsetLeft, el.offsetLeft + el.offsetWidth, el.offsetLeft + el.offsetWidth/2);
        targetsY.push(el.offsetTop, el.offsetTop + el.offsetHeight, el.offsetTop + el.offsetHeight/2);
      });

      let minDx = Infinity;
      targetsX.forEach(tx => {
        if (Math.abs(cx - tx) < threshold && Math.abs(cx - tx) < minDx) { minDx = Math.abs(cx - tx); resX = tx - w/2; guideX = tx; }
        else if (Math.abs(x - tx) < threshold && Math.abs(x - tx) < minDx) { minDx = Math.abs(x - tx); resX = tx; guideX = tx; }
        else if (Math.abs(x + w - tx) < threshold && Math.abs(x + w - tx) < minDx) { minDx = Math.abs(x + w - tx); resX = tx - w; guideX = tx; }
      });

      let minDy = Infinity;
      targetsY.forEach(ty => {
        if (Math.abs(cy - ty) < threshold && Math.abs(cy - ty) < minDy) { minDy = Math.abs(cy - ty); resY = ty - h/2; guideY = ty; }
        else if (Math.abs(y - ty) < threshold && Math.abs(y - ty) < minDy) { minDy = Math.abs(y - ty); resY = ty; guideY = ty; }
        else if (Math.abs(y + h - ty) < threshold && Math.abs(y + h - ty) < minDy) { minDy = Math.abs(y + h - ty); resY = ty - h; guideY = ty; }
      });
      return { x: resX, y: resY, guideX, guideY };
    }

    function updateGuide(x, y) {
      const gV = document.getElementById('guideV'); const gH = document.getElementById('guideH');
      if (x !== null) { gV.style.left = x + 'px'; gV.style.display = 'block'; } else { gV.style.display = 'none'; }
      if (y !== null) { gH.style.top = y + 'px'; gH.style.display = 'block'; } else { gH.style.display = 'none'; }
    }
    function hideGuide() { document.getElementById('guideV').style.display = 'none'; document.getElementById('guideH').style.display = 'none'; }

    function selectElement(id) {
      if (selectedId && document.getElementById(selectedId)) {
        document.getElementById(selectedId).classList.remove('selected');
        const prevText = document.getElementById(selectedId).querySelector('.text-content');
        if (prevText) prevText.contentEditable = false;
      }
      
      selectedId = id; const tabBtnEdit = document.getElementById('tabBtnEdit');
      
      if (id) {
        document.getElementById(id).classList.add('selected');
        tabBtnEdit.style.display = 'block'; switchTab('tabEdit');
        const elData = elements.find(e => e.id === id);
        if (elData.type === 'text') {
          document.getElementById('textOnlyTools').style.display = 'flex';
          document.getElementById('itemFontSize').value = parseInt(elData.style.fontSize) || 48;
          document.getElementById('itemFont').value = elData.style.fontFamily;
          document.getElementById('itemColor').value = rgbToHex(elData.style.color);
          
          updateBtnState('btnBold', elData.style.fontWeight === 'bold');
        } else document.getElementById('textOnlyTools').style.display = 'none';
      } else {
        tabBtnEdit.style.display = 'none';
        if (document.getElementById('tabEdit').classList.contains('active')) switchTab('tabCard');
      }
      updateLayerPanel();
    }

    function updateItemStyle(key, val) {
      if (!selectedId) return;
      elements.find(e => e.id === selectedId).style[key] = val;
      document.getElementById(selectedId).querySelector('.item-content').style[key] = val; saveState();
    }

    function updateFontSize(val) {
      if (!selectedId) return;
      const size = Math.max(1, parseInt(val) || 16);
      const el = elements.find(e => e.id === selectedId);
      if (el && el.type === 'text') {
        el.style.fontSize = size + 'px';
        document.getElementById(selectedId).querySelector('.item-content').style.fontSize = size + 'px';
        saveState();
      }
    }
    
    function toggleStyle(key, onVal, offVal) {
      if (!selectedId) return;
      const el = elements.find(e => e.id === selectedId);
      const currentVal = el.style[key];
      // ブラウザによる書式変換を無視するため、「none」「空文字」「offVal(normal等)」以外がセットされていればオンとみなす
      const isSet = currentVal && currentVal !== offVal && currentVal !== 'none' && currentVal !== '';
      updateItemStyle(key, isSet ? offVal : onVal); 
      selectElement(selectedId);
    }
    
    function updateBtnState(id, isActive) { document.getElementById(id).classList.toggle('active', isActive); }
    function deleteElement(id) {
      elements = elements.filter(e => e.id !== id); document.getElementById(id).remove();
      if (selectedId === id) selectElement(null); saveState(); updateLayerPanel();
    }
    function deleteSelected() { if(selectedId) deleteElement(selectedId); }

    function toggleLayerPanel() {
      const panel = document.getElementById('layerPanel');
      if (panel.classList.contains('open')) { panel.classList.remove('open'); }
      else { updateLayerPanel(); panel.classList.add('open'); }
    }

    function updateLayerPanel() {
      const list = document.getElementById('layerList'); list.innerHTML = '';
      [...elements].sort((a, b) => b.z - a.z).forEach((el, index, arr) => {
        const item = document.createElement('div'); item.className = 'layer-item' + (el.id === selectedId ? ' active' : '');
        item.onclick = () => selectElement(el.id);
        const title = document.createElement('div'); title.className = 'layer-title';
        title.innerText = el.type === 'text' ? (el.content || '空テキスト') : '🖼 画像';
        
        const btnUp = document.createElement('button'); btnUp.className = 'layer-btn'; btnUp.innerHTML = '↑';
        btnUp.onclick = (e) => { e.stopPropagation(); moveLayer(el.id, 1); };
        const btnDown = document.createElement('button'); btnDown.className = 'layer-btn'; btnDown.innerHTML = '↓';
        btnDown.onclick = (e) => { e.stopPropagation(); moveLayer(el.id, -1); };

        item.appendChild(title);
        if (index > 0) item.appendChild(btnUp);
        if (index < arr.length - 1) item.appendChild(btnDown);
        list.appendChild(item);
      });
    }

    function moveLayer(id, dir) {
      elements.sort((a, b) => a.z - b.z);
      const idx = elements.findIndex(e => e.id === id); if (idx < 0) return;
      if (dir === 1 && idx < elements.length - 1) { [elements[idx].z, elements[idx+1].z] = [elements[idx+1].z, elements[idx].z]; }
      else if (dir === -1 && idx > 0) { [elements[idx].z, elements[idx-1].z] = [elements[idx-1].z, elements[idx].z]; }
      elements.forEach(el => { document.getElementById(el.id).style.zIndex = el.z; });
      updateLayerPanel(); saveState();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.toolbar-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      const btnMap = { 'tabCard': 0, 'tabAdd': 1, 'tabEdit': 2 };
      document.querySelectorAll('.tab-btn')[btnMap[tabId]].classList.add('active');
    }

    let scale = 1, panX = 0, panY = 0;
    const activePointers = new Map();
    let initPinchDist, initPinchScale, initPinchMid, initPan;

    function updateTransform() { zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

    function resetZoom(force = false) {
      const vW = viewport.clientWidth; const vH = viewport.clientHeight;
      const targetScale = Math.min((vW - 40) / CARD_W, (vH - 40) / CARD_H, 1.0);
      scale = Math.max(0.2, targetScale); panX = 0; panY = 0;
      updateTransform();
    }

    viewport.addEventListener('pointerdown', e => {
      if (e.target.closest('.item-box')) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size >= 2) {
        isMultiTouchActive = true; const pts = Array.from(activePointers.values());
        initPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initPinchScale = scale; initPinchMid = { x: (pts[0].x + pts[1].x)/2, y: (pts[0].y + pts[1].y)/2 }; initPan = { x: panX, y: panY };
      } else if (e.target === viewport || e.target === card || e.target.classList.contains('trump-decor')) {
        selectElement(null);
      }
    });

    viewport.addEventListener('pointermove', e => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size >= 2 && initPinchDist) {
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const mid = { x: (pts[0].x + pts[1].x)/2, y: (pts[0].y + pts[1].y)/2 };
        scale = Math.min(Math.max(0.2, initPinchScale * (dist / initPinchDist)), 3);
        panX = initPan.x + (mid.x - initPinchMid.x); panY = initPan.y + (mid.y - initPinchMid.y); updateTransform();
      }
    });

    const endPointer = e => {
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) { initPinchDist = null; setTimeout(() => { isMultiTouchActive = false; }, 200); }
    };
    viewport.addEventListener('pointerup', endPointer); viewport.addEventListener('pointercancel', endPointer);
    viewport.addEventListener('wheel', e => {
      e.preventDefault(); scale = Math.min(Math.max(0.2, scale * (e.deltaY < 0 ? 1.1 : 0.9)), 3); updateTransform();
    }, { passive: false });

    let lastWinWidth = window.innerWidth;
    window.addEventListener('resize', () => {
      if (window.innerWidth !== lastWinWidth) {
        lastWinWidth = window.innerWidth;
        resetZoom();
      }
    });

    function downloadCard() {
      selectElement(null); const prevTrans = zoomWrapper.style.transform; zoomWrapper.style.transform = 'none';
      html2canvas(card, { scale: 2, backgroundColor: null }).then(canvas => {
        zoomWrapper.style.transform = prevTrans;
        const link = document.createElement('a'); link.download = 'AI_Trump_Ultra.png';
        link.href = canvas.toDataURL("image/png"); link.click();
      });
    }

    function rgbToHex(rgb) {
      if (!rgb || rgb.startsWith("#")) return rgb || "#ffffff";
      const res = rgb.match(/\d+/g);
      return res ? "#" + res.slice(0,3).map(x => (+x).toString(16).padStart(2, '0')).join('') : "#ffffff";
    }

    window.onload = () => {
      saveState(true); addElement('text'); selectElement(null); setTimeout(() => resetZoom(true), 100);
    };
  </script>
</body>
